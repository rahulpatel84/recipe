<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Recipes — Relish Realm</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,100,1&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--cream:#FAF6EF;--ink:#1B1A17;--muted:#6F6A61;--line:#ECE6DB;--tomato:#E5533C;--pickle:#4F7A3A;--pickle-soft:#E7EFDD;--mustard:#F4B740;--mustard-soft:#FDF1D3;--blush:#FBE4DE;--sky:#E3ECF3;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hand{font-family:Caveat,cursive;color:var(--tomato);font-size:1.45rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:600;font-size:.93rem;border:1.5px solid var(--ink);background:#fff;cursor:pointer;font-family:inherit}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover{background:var(--tomato);border-color:var(--tomato)}
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:700;font-size:1.35rem;font-variation-settings:"SOFT" 100,"WONK" 1}
.logo svg{width:34px;height:34px}
.links{display:flex;gap:28px;font-size:.93rem;font-weight:500}.links a:hover,.links a.on{color:var(--tomato)}

.head{padding:56px 0 32px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
h1{font-family:Fraunces,serif;font-variation-settings:"SOFT" 100,"WONK" 1;font-size:clamp(2.4rem,5vw,3.6rem);font-weight:600;line-height:1.05;letter-spacing:-.02em}
.head p{color:var(--muted);margin-top:8px}
.search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:999px;padding:12px 20px;min-width:340px;box-shadow:4px 4px 0 var(--ink)}
.search input{border:0;outline:0;font:inherit;flex:1;background:transparent}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:32px}
.tabs button{border:0;background:none;padding:12px 16px;font:500 .95rem Inter;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--tomato)}

.layout{display:grid;grid-template-columns:240px 1fr;gap:48px}
.filters h4{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.fgroup{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.fgroup label{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:.93rem;cursor:pointer}
.fgroup input{appearance:none;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:5px;display:grid;place-items:center;cursor:pointer}
.fgroup input:checked{background:var(--ink)}
.fgroup input:checked::after{content:"✓";color:#fff;font-size:.7rem}
.fgroup .c{margin-left:auto;color:var(--muted);font-size:.8rem}
.time{display:flex;flex-wrap:wrap;gap:6px}
.time button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:500 .83rem Inter;cursor:pointer}
.time button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.9rem;color:var(--muted);gap:12px;flex-wrap:wrap}
.bar select{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;color:var(--ink);background:#fff}
.active{display:flex;gap:6px;flex-wrap:wrap}
.active span{background:var(--cream);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 22px}
.card .img{aspect-ratio:1/1;border-radius:var(--r);display:grid;place-items:center;position:relative;transition:.3s}
.card:hover .img{transform:translateY(-4px)}
.card .img svg{width:60%}
.card .tag{position:absolute;top:12px;left:12px;background:#fff;border-radius:999px;padding:4px 10px;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.card .save{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer}
.card h3{font-family:Fraunces,serif;font-size:1.18rem;font-weight:600;margin:12px 0 4px;line-height:1.25}
.card:hover h3{color:var(--tomato)}
.meta{display:flex;gap:12px;font-size:.83rem;color:var(--muted)}.meta b{color:var(--ink)}

.empty{grid-column:1/-1;text-align:center;padding:64px 0;color:var(--muted)}
.empty svg{width:90px;margin-bottom:10px}
.more{display:flex;justify-content:center;margin:48px 0 96px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.filters{display:none}.grid{grid-template-columns:repeat(2,1fr)}.links{display:none}.search{min-width:0;width:100%}}
@media (max-width:560px){.wrap{padding:0 16px}.grid{gap:20px 14px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="pip" viewBox="0 0 100 120"><ellipse cx="50" cy="114" rx="30" ry="5" fill="#1B1A17" opacity=".08"/><path d="M50 8c22 0 32 18 32 50s-10 52-32 52-32-20-32-52S28 8 50 8z" fill="#7BA84F" stroke="#1B1A17" stroke-width="3"/><circle cx="34" cy="34" r="3" fill="#5A8A37"/><circle cx="66" cy="44" r="3" fill="#5A8A37"/><circle cx="30" cy="78" r="3" fill="#5A8A37"/><circle cx="40" cy="56" r="5" fill="#1B1A17"/><circle cx="62" cy="56" r="5" fill="#1B1A17"/><circle cx="41.5" cy="54.5" r="1.6" fill="#fff"/><circle cx="63.5" cy="54.5" r="1.6" fill="#fff"/><path d="M42 68q9 9 18 0" fill="none" stroke="#1B1A17" stroke-width="3" stroke-linecap="round"/><ellipse cx="32" cy="66" rx="5" ry="3" fill="#F29C8A" opacity=".8"/><ellipse cx="70" cy="66" rx="5" ry="3" fill="#F29C8A" opacity=".8"/><path d="M50 8q4-8 12-6" fill="none" stroke="#1B1A17" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="bowl" viewBox="0 0 200 160"><path d="M30 70h140c0 40-30 66-70 66S30 110 30 70z" fill="#fff" stroke="#1B1A17" stroke-width="3"/><path d="M44 70c6-22 28-30 56-30s50 8 56 30" fill="currentColor" stroke="#1B1A17" stroke-width="3"/><path d="M60 58q10-10 20 0t20 0 20 0 20 0" fill="none" stroke="#1B1A17" stroke-width="2.5" stroke-linecap="round" opacity=".5"/><path d="M90 44q4-10 12-8M122 50q6-6 12-2" fill="none" stroke="#4F7A3A" stroke-width="3" stroke-linecap="round"/><path d="M140 24l30-20" stroke="#1B1A17" stroke-width="3" stroke-linecap="round"/></symbol>
</defs></svg>

<nav><div class="wrap">
  <a class="logo" href="index.html"><svg><use href="#pip"/></svg>Relish Realm</a>
  <div class="links"><a class="on" href="browse.html">Recipes</a><a href="#">Cuisines</a><a href="#">Dietary</a><a href="#">Collections</a></div>
  <a class="btn btn-ink" href="#">Sign in</a>
</div></nav>

<main class="wrap">
  <div class="head">
    <div><span class="hand">the whole pantry</span><h1>All recipes</h1><p>Every one tested in a real home kitchen.</p></div>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" placeholder="Search by dish or ingredient"></label>
  </div>

  <div class="tabs" id="tabs">
    <button class="on" data-m="">All</button><button data-m="Breakfast">Breakfast</button><button data-m="Lunch">Lunch</button><button data-m="Dinner">Dinner</button><button data-m="Soup">Soups</button><button data-m="Snack">Quick bites</button>
  </div>

  <div class="layout">
    <aside class="filters">
      <div class="fgroup"><h4>Cuisine</h4><div id="fc"></div></div>
      <div class="fgroup"><h4>Dietary</h4><div id="fd"></div></div>
      <div class="fgroup"><h4>Total time</h4><div class="time" id="ft"><button data-t="15">≤ 15 min</button><button data-t="30">≤ 30 min</button><button data-t="60">≤ 1 hr</button></div></div>
      <button class="btn" style="width:100%;justify-content:center" onclick="reset()">Clear all</button>
    </aside>

    <div>
      <div class="bar"><div><b id="count" style="color:var(--ink)"></b> recipes <span class="active" id="active"></span></div>
        <select id="sort"><option value="pop">Most popular</option><option value="rate">Top rated</option><option value="time">Quickest</option></select></div>
      <div class="grid" id="grid"></div>
      <div class="more"><button class="btn">Load more recipes</button></div>
    </div>
  </div>
</main>

<script>
const R=[
 ['Classic Carbonara','Italian','Dinner',[],20,4.8,1200,'#FBE4DE','#F4B740'],
 ['Chicken Tikka Masala','Indian','Dinner',['Gluten-free'],45,4.9,2400,'#FDF1D3','#E5533C'],
 ['Street-Style Beef Tacos','Mexican','Dinner',[],30,4.6,640,'#E7EFDD','#C9763C'],
 ['Hearty Miso Ramen','Japanese','Dinner',[],40,4.9,880,'#E3ECF3','#E8C27A'],
 ['Classic Margherita','Italian','Dinner',['Vegetarian'],25,4.9,1500,'#FBE4DE','#E5533C'],
 ['Garden Avocado Toast','American','Breakfast',['Vegetarian'],10,4.5,700,'#E7EFDD','#8DB360'],
 ['Energy Smoothie Bowl','American','Breakfast',['Vegan','Gluten-free'],15,4.7,520,'#F3E3F0','#B05FA0'],
 ['Mediterranean Quinoa Salad','Greek','Lunch',['Vegan','Gluten-free'],15,4.4,410,'#E3ECF3','#8DB360'],
 ['Spiced Lentil Soup','Middle Eastern','Soup',['Vegan','Gluten-free'],35,4.8,912,'#FDF1D3','#E5533C'],
 ['Fluffy Blueberry Pancakes','American','Breakfast',['Vegetarian'],25,4.8,1100,'#E3ECF3','#6B7FC4'],
 ['Garlic Cheese Toastie','American','Snack',['Vegetarian'],5,4.8,300,'#FDF1D3','#F4B740'],
 ['Chana Masala','Indian','Lunch',['Vegan','Gluten-free'],30,4.7,760,'#FBE4DE','#C9763C'],
];
const st={q:'',meal:'',c:new Set(),d:new Set(),t:0,sort:'pop'};
const uniq=a=>[...new Set(a)].sort();
function boxes(id,vals,set,count){document.getElementById(id).innerHTML=vals.map(v=>`<label><input type="checkbox" value="${v}">${v}<span class="c">${count(v)}</span></label>`).join('');
 document.getElementById(id).onchange=e=>{e.target.checked?set.add(e.target.value):set.delete(e.target.value);draw()}}
boxes('fc',uniq(R.map(r=>r[1])),st.c,v=>R.filter(r=>r[1]===v).length);
boxes('fd',uniq(R.flatMap(r=>r[3])),st.d,v=>R.filter(r=>r[3].includes(v)).length);
document.getElementById('tabs').onclick=e=>{if(e.target.dataset.m===undefined)return;document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');st.meal=e.target.dataset.m;draw()};
document.getElementById('ft').onclick=e=>{const t=+e.target.dataset.t;if(!t)return;st.t=st.t===t?0:t;document.querySelectorAll('#ft button').forEach(b=>b.classList.toggle('on',+b.dataset.t===st.t));draw()};
document.getElementById('q').oninput=e=>{st.q=e.target.value.toLowerCase();draw()};
document.getElementById('sort').onchange=e=>{st.sort=e.target.value;draw()};
function reset(){st.c.clear();st.d.clear();st.t=0;document.querySelectorAll('.filters input').forEach(i=>i.checked=false);document.querySelectorAll('#ft button').forEach(b=>b.classList.remove('on'));draw()}
function draw(){
 let L=R.filter(r=>(!st.q||r[0].toLowerCase().includes(st.q)||r[1].toLowerCase().includes(st.q))&&(!st.meal||r[2]===st.meal)&&(!st.c.size||st.c.has(r[1]))&&[...st.d].every(d=>r[3].includes(d))&&(!st.t||r[4]<=st.t));
 L.sort((a,b)=>st.sort==='rate'?b[5]-a[5]:st.sort==='time'?a[4]-b[4]:b[6]-a[6]);
 document.getElementById('count').textContent=L.length;
 document.getElementById('active').innerHTML=[...st.c,...st.d,...(st.t?['≤ '+st.t+' min']:[])].map(x=>`<span>${x}</span>`).join('');
 document.getElementById('grid').innerHTML=L.length?L.map(r=>`<a class="card" href="recipe.html"><div class="img" style="background:${r[7]};color:${r[8]}"><span class="tag">${r[1]}</span><span class="save" onclick="event.preventDefault();this.textContent=this.textContent==='♡'?'♥':'♡'">♡</span><svg viewBox="0 0 200 160"><use href="#bowl"/></svg></div><h3>${r[0]}</h3><div class="meta"><span><b>★ ${r[5]}</b></span><span>${r[4]} min</span>${r[3][0]?`<span>${r[3][0]}</span>`:''}</div></a>`).join('')
 :`<div class="empty"><svg viewBox="0 0 100 120"><use href="#pip"/></svg><p><b style="color:var(--ink)">Pip couldn't find anything.</b><br>Try removing a filter or two.</p></div>`;
}
draw();
</script>
</body>
</html>
